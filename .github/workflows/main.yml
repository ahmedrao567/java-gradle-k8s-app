name: Simple Java CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOCKER_IMAGE: ahmedikram567/java-gradle-k8s-app
  HELM_RELEASE: java-gradle-k8s-app
  HELM_CHART_DIR: ./helm-chart
  K8S_NAMESPACE: default

jobs:
  pipeline:
    name: Run CI/CD Pipeline
    runs-on: [self-hosted]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version

      - name: Build and test
        run: ./gradlew clean build test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

      - name: Setup kubeconfig
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_DATA" > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl config set-cluster default --insecure-skip-tls-verify=true
          kubectl get nodes

      - name: Validate DB password secret
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          if [ -z "$DB_PASSWORD" ]; then
            echo "DB_PASSWORD secret is missing or empty. Set it in GitHub Actions secrets."
            exit 1
          fi

      - name: Deploy PostgreSQL with Helm
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update
          helm upgrade --install my-postgres bitnami/postgresql \
            -n ${{ env.K8S_NAMESPACE }} --create-namespace \
            --set-string auth.password="$DB_PASSWORD" \
            --set-string auth.postgresPassword="$DB_PASSWORD" \
            --set-string auth.username="appuser" \
            --set-string auth.database="appdb"

      - name: Deploy Spring Boot App
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          helm upgrade --install ${{ env.HELM_RELEASE }} ${{ env.HELM_CHART_DIR }} \
            --set image.repository=${{ env.DOCKER_IMAGE }} \
            --set image.tag=${{ github.sha }} \
            --set-string database.password="$DB_PASSWORD" \
            -n ${{ env.K8S_NAMESPACE }} --create-namespace

      - name: Verify deployment
        run: |
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}
          kubectl get svc -n ${{ env.K8S_NAMESPACE }}

      - name: Cleanup
        if: always()
        run: |
          docker system prune -af