name: Simple Java CI/CD (Azure k3s)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOCKER_IMAGE: ahmedikram567/java-gradle-k8s-app
  HELM_RELEASE: java-gradle-k8s-app
  HELM_CHART_DIR: ./helm-chart
  K8S_NAMESPACE: default

jobs:
  pipeline:
    name: Run CI/CD Pipeline
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # 1. Checkout code
      # -------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------
      # 2. Setup Java
      # -------------------------
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # -------------------------
      # 3. Build + Test
      # -------------------------
      - name: Build and test
        run: ./gradlew clean build test

      # -------------------------
      # 4. Docker login
      # -------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # -------------------------
      # 5. Build + Push Image
      # -------------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

      # -------------------------
      # 6. Install kubectl + helm
      # -------------------------
      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      # -------------------------
      # 7. Setup kubeconfig (Azure access)
      # -------------------------
      - name: Setup kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      # -------------------------
      # 8. Deploy PostgreSQL
      # -------------------------
      - name: Deploy PostgreSQL
        run: |
          helm upgrade --install postgres ${{ env.HELM_CHART_DIR }} \
            -f ${{ env.HELM_CHART_DIR }}/postgres-values.yaml \
            -n ${{ env.K8S_NAMESPACE }} --create-namespace

      # -------------------------
      # 9. Deploy Spring Boot App
      # -------------------------
      - name: Deploy Spring Boot App
        run: |
          helm upgrade --install ${{ env.HELM_RELEASE }} ${{ env.HELM_CHART_DIR }} \
            --set image.repository=${{ env.DOCKER_IMAGE }} \
            --set image.tag=${{ github.sha }} \
            -n ${{ env.K8S_NAMESPACE }} --create-namespace

      # -------------------------
      # 10. Cleanup
      # -------------------------
      - name: Cleanup
        if: always()
        run: |
          docker system prune -af