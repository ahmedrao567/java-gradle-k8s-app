name: Simple Java CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOCKER_IMAGE: ahmedikram567/java-gradle-k8s-app
  HELM_RELEASE: java-gradle-k8s-app
  HELM_CHART_DIR: ./helm-chart
  K8S_NAMESPACE: default

jobs:
  pipeline:
    name: Run CI/CD Pipeline
    runs-on: [self-hosted]

    steps:
      # -------------------------
      # 1. Checkout code
      # -------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------
      # 2. Setup Java
      # -------------------------
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # -------------------------
      # 3. Build + Test
      # -------------------------
      - name: Build and test
        run: ./gradlew clean build test

      # -------------------------
      # 4. Docker login
      # -------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # -------------------------
      # 5. Build + Push Image
      # -------------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

      # -------------------------
      # 6. Setup kubeconfig (connect to Azure k3s)
      # -------------------------
      - name: Setup kubeconfig
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_DATA" > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl config set-cluster default --insecure-skip-tls-verify=true
          kubectl get nodes

      # -------------------------
      # 7. Deploy PostgreSQL with Helm
      # -------------------------
      - name: Deploy PostgreSQL with Helm
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update
          helm upgrade --install my-postgres bitnami/postgresql \
            -n ${{ env.K8S_NAMESPACE }} --create-namespace \
            --set auth.postgresPassword=${{ secrets.DB_PASSWORD }},auth.username=appuser,auth.database=appdb

      # -------------------------
      # 8. Deploy Spring Boot App
      # -------------------------
      - name: Deploy Spring Boot App
        run: |
          helm upgrade --install ${{ env.HELM_RELEASE }} ${{ env.HELM_CHART_DIR }} \
            --set image.repository=${{ env.DOCKER_IMAGE }} \
            --set image.tag=${{ github.sha }} \
            --set database.host=my-postgres-postgresql \
            --set database.port=5432 \
            --set database.name=appdb \
            --set database.username=appuser \
            --set database.password=${{ secrets.DB_PASSWORD }} \
            -n ${{ env.K8S_NAMESPACE }} --create-namespace

      # -------------------------
      # 9. Verify deployment
      # -------------------------
      - name: Verify deployment
        run: |
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}
          kubectl get svc -n ${{ env.K8S_NAMESPACE }}

      # -------------------------
      # 10. Cleanup
      # -------------------------
      - name: Cleanup
        if: always()
        run: |
          docker system prune -af