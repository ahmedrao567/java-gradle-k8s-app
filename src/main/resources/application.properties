# -------------------
# SERVER CONFIG
# -------------------
server.port=8081

# -------------------
# ACTUATOR
# -------------------
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health,metrics,prometheus

# -------------------
# DATABASE (KUBERNETES READY)
# -------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://my-postgres-postgresql:5432/appdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:appuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:apppassword}

spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari (safe defaults for K8s)
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.maximum-pool-size=5

# -------------------
# IMPORTANT FIX (CRASH ISSUE FIXED)
# -------------------
spring.sql.init.mode=never
spring.sql.init.continue-on-error=false

# -------------------
# JPA (if using Hibernate)
# -------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect