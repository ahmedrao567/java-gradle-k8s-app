# -------------------
# SERVER CONFIG
# -------------------
server.port=8081

# -------------------
# ACTUATOR (safe for K8s)
# -------------------
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health,metrics,prometheus
management.health.db.enabled=false

# -------------------
# DATABASE (KUBERNETES READY)
# -------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://my-postgres-postgresql:5432/appdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:appuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:apppassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# -------------------
# HIKARI (FIXED FOR K8s STARTUP STABILITY)
# -------------------
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.maximum-pool-size=5

# -------------------
# SQL INIT (STOP CRASH LOOP)
# -------------------
spring.sql.init.mode=never
spring.sql.init.continue-on-error=false

# -------------------
# JPA (SAFE DEFAULTS)
# -------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false